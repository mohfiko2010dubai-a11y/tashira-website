name: CI

# This workflow verifies review changes only. It must never deploy, connect to
# production, use production secrets, or restart application services.
# The integration job owns an ephemeral MySQL service containing synthetic data only.
on:
  pull_request:
    branches:
      - main
      - master
  push:
    # Production branches are intentionally excluded from this Phase 1 review
    # workflow. Production deployment remains a separate concern.
    branches-ignore:
      - main
      - master

# Keep the default token read-only. No repository or production secrets are
# referenced by this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-integration:
    name: Passport, finance and audit integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      OPS_REHEARSAL_DATABASE_URL: mysql://root:disposable-ci-only@127.0.0.1:33306/tashira_ops_rehearsal_ci
      OPS_REHEARSAL_RECREATE: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build synthetic schema and verify migration rollback
        run: npx tsx scripts/rehearse-operations-migration-chain.ts
      - name: Run every guarded MySQL integration test
        run: node scripts/run-mysql-integrations.mjs

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Node.js 20 matches the repository Docker image and documented runtime.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Do not add continue-on-error or bypass existing failures. Current
      # failures must be recorded and fixed incrementally in reviewed changes.
      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
